name: Apply static Citizenship navigation fix

on:
  push:
    branches:
      - static-citizenship-navigation-fix

permissions:
  contents: write

jobs:
  patch-static-html:
    if: ${{ !contains(github.event.head_commit.message, '[static-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: static-citizenship-navigation-fix
          fetch-depth: 0
      - name: Add Citizenship navigation and Charter sidebar link
        shell: python
        run: |
          from pathlib import Path

          nav_link = '      <a href="citizenship.html">Citizenship &amp; Due Process</a>\n'
          charter_anchor = '      <a href="charter.html">The Charter</a>\n'

          changed = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if 'class="main-nav"' not in text:
                  continue
              if 'href="citizenship.html"' not in text:
                  if charter_anchor not in text:
                      raise SystemExit(f'Expected Charter navigation anchor not found in {path}')
                  text = text.replace(charter_anchor, charter_anchor + nav_link, 1)
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          charter = Path('charter.html')
          text = charter.read_text(encoding='utf-8')
          citizenship_button = '      <a class="button secondary small" href="citizenship.html">Citizenship &amp; Due Process</a>\n'
          principles_button = '      <a class="button secondary small" href="principles.html">12 Principles</a>\n'
          if citizenship_button not in text:
              if principles_button not in text:
                  raise SystemExit('Expected 12 Principles sidebar button not found in charter.html')
              text = text.replace(principles_button, citizenship_button + principles_button, 1)
              charter.write_text(text, encoding='utf-8')
              if 'charter.html' not in changed:
                  changed.append('charter.html')

          workflow = Path('.github/workflows/apply-static-citizenship-fix.yml')
          if workflow.exists():
              workflow.unlink()
              changed.append(str(workflow))

          print('Updated:', ', '.join(changed))
      - name: Commit static HTML repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Statically add Citizenship navigation and Charter link [static-fix-applied]"
          git push origin HEAD:static-citizenship-navigation-fix
