name: Quarterly transportation source-review draft
on:
  schedule:
    # January, April, July and October 20th (UTC). Sources may be released later.
    - cron: '17 13 20 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: transportation-quarterly-source-review
  cancel-in-progress: false

jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare reusable quarter-specific review branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fyq=$(python - <<'PY'
          import datetime as d
          from importlib.machinery import SourceFileLoader
          mod = SourceFileLoader("quarterly", "scripts/transportation-quarterly-review.py").load_module()
          y,q,_ = mod.quarter_for(d.datetime.now(d.timezone.utc).date())
          print(f"fy{y}-q{q}")
          PY
          )
          branch="automation/transportation-${fyq}"
          echo "REVIEW_BRANCH=$branch" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git switch -C "$branch" "origin/$branch"
          else
            git switch -c "$branch"
          fi
      - name: Run offline safety tests
        run: python -m unittest discover -s tests -p 'transportation_quarterly_test.py' -v
      - name: Fetch government-source evidence
        run: python scripts/transportation-quarterly-review.py
      - name: Open or update draft PR (not public website)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add data/transportation/quarterly-reviews/ TRANSPORTATION_QUARTERLY_REVIEW.md
          if git diff --cached --quiet; then
            echo "No review changes"
            exit 0
          fi
          git commit -m "Draft quarterly DOT evidence: ${REVIEW_BRANCH##*/}"
          git push origin "$REVIEW_BRANCH"
          if [ "$(gh pr list --head "$REVIEW_BRANCH" --state open --json number --jq 'length')" -gt 0 ]; then
            echo "Existing reviewer pull request updated via evidence branch"
          elif gh pr create --draft --base main --head "$REVIEW_BRANCH" \
              --title "Verify DOT sources: ${REVIEW_BRANCH##*/}" \
              --body "Government-source metadata, checksums and review flags only. NOT verified public spending data. Human reconciliation and approval required."; then
            echo "Draft reviewer pull request created"
          else
            echo "::warning::GitHub Actions may not create pull requests in this repository; the evidence branch was pushed."
            review_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${REVIEW_BRANCH}?expand=1"
            title="Manual DOT source review: ${REVIEW_BRANCH##*/}"
            printf '### Manual review required\n\nEvidence branch: %s\n\n[Open a draft PR](%s)\n' "$REVIEW_BRANCH" "$review_url" >> "$GITHUB_STEP_SUMMARY"
            # GitHub Actions PR creation can be disabled by repository policy.
            # If issue creation is also prohibited, retain the review URL in job summary.
            if [ "$(gh issue list --state open --search "$title in:title" --json number --jq 'length' 2>/dev/null || echo 0)" -eq 0 ]; then
              gh issue create --title "$title" --body "Quarterly evidence is staged on \`$REVIEW_BRANCH\`. GitHub Actions could not open a PR under repository policy. [Create a draft PR]($review_url). Review official sources and reconcile amounts before any website edits." || echo "::warning::Issue creation blocked; review link remains in job summary."
            fi
          fi
