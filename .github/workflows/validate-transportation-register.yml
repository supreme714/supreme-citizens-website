name: Validate transportation spending register
on:
  pull_request:
    paths:
      - 'transportation-spending.html'
      - 'campaign-commitments.html'
      - 'sitemap.xml'
      - 'tests/transportation-register.test.mjs'
      - 'tests/transportation_quarterly_test.py'
      - 'scripts/transportation-quarterly-review.py'
      - '.github/workflows/transportation-quarterly-review.yml'
      - '.github/workflows/validate-transportation-register.yml'
  push:
    branches: [main]
    paths:
      - 'transportation-spending.html'
      - 'campaign-commitments.html'
      - 'sitemap.xml'
      - 'tests/transportation-register.test.mjs'
      - '.github/workflows/validate-transportation-register.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source-linked page, funding totals, and navigation
        run: node --test tests/transportation-register.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate quarterly review safeguards without network
        run: python -m unittest discover -s tests -p 'transportation_quarterly_test.py' -v
