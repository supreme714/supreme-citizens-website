<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
<title id="title">Supreme Citizens vs. Sovereign Citizens</title>
<desc id="desc">Educational comparison showing that Supreme Citizens supports constitutional government, rule of law, civic responsibility and peaceful participation, while sovereign citizen ideology commonly rejects or claims exemption from governmental jurisdiction.</desc>
<rect width="1200" height="1500" fill="#f7f3e8"/>
<rect width="1200" height="190" fill="#0b315b"/>
<text x="600" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="48" font-weight="700" fill="white">SUPREME CITIZENS vs. SOVEREIGN CITIZENS</text>
<text x="600" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#f0d38a">Similar-sounding names. Fundamentally different ideas.</text>
<rect x="55" y="225" width="520" height="1120" rx="22" fill="#eef5ff" stroke="#0b315b" stroke-width="5"/>
<rect x="625" y="225" width="520" height="1120" rx="22" fill="#fff1f1" stroke="#8e2430" stroke-width="5"/>
<text x="315" y="292" text-anchor="middle" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#0b315b">SUPREME CITIZENS</text>
<text x="885" y="292" text-anchor="middle" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#8e2430">SOVEREIGN CITIZENS</text>
<text x="315" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0b315b">CONSTITUTIONAL • RESPONSIBLE • ENGAGED</text>
<text x="885" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#8e2430">COMMONLY REJECTS GOVERNMENT AUTHORITY</text>
<g font-family="Arial,sans-serif" font-size="22" fill="#142033">
<text x="90" y="405" font-weight="700" fill="#0b315b">VIEW OF GOVERNMENT</text><text x="90" y="442">Legitimate authority comes from We the People</text><text x="90" y="474">within the constitutional system.</text>
<text x="660" y="405" font-weight="700" fill="#8e2430">VIEW OF GOVERNMENT</text><text x="660" y="442">Adherents may claim government is illegitimate</text><text x="660" y="474">or lacks jurisdiction over them.</text>
<text x="90" y="555" font-weight="700" fill="#0b315b">CONSTITUTION &amp; LAW</text><text x="90" y="592">Supports the Constitution, rule of law, courts</text><text x="90" y="624">and lawful civic processes.</text>
<text x="660" y="555" font-weight="700" fill="#8e2430">CONSTITUTION &amp; LAW</text><text x="660" y="592">Often rejects federal, state or local authority</text><text x="660" y="624">through pseudo-legal theories.</text>
<text x="90" y="705" font-weight="700" fill="#0b315b">CITIZENSHIP</text><text x="90" y="742">Citizenship carries rights and civic</text><text x="90" y="774">responsibilities.</text>
<text x="660" y="705" font-weight="700" fill="#8e2430">CITIZENSHIP</text><text x="660" y="742">Adherents may claim separation from U.S.</text><text x="660" y="774">governmental jurisdiction.</text>
<text x="90" y="855" font-weight="700" fill="#0b315b">CIVIC OBLIGATIONS</text><text x="90" y="892">Recognizes lawful taxes, licensing, regulations</text><text x="90" y="924">and court authority.</text>
<text x="660" y="855" font-weight="700" fill="#8e2430">CIVIC OBLIGATIONS</text><text x="660" y="892">Some adherents claim exemption from taxes,</text><text x="660" y="924">licenses, regulations or court orders.</text>
<text x="90" y="1005" font-weight="700" fill="#0b315b">CIVIC ACTION</text><text x="90" y="1042">Vote • Learn • Petition • Participate • Question</text><text x="90" y="1074">and hold government accountable.</text>
<text x="660" y="1005" font-weight="700" fill="#8e2430">CIVIC ACTION</text><text x="660" y="1042">May attempt to avoid government authority</text><text x="660" y="1074">through declarations or pseudo-legal filings.</text>
<text x="90" y="1155" font-weight="700" fill="#0b315b">POLITICAL CHANGE</text><text x="90" y="1192">Peaceful, lawful, constitutional participation</text><text x="90" y="1224">and reform.</text>
<text x="660" y="1155" font-weight="700" fill="#8e2430">POLITICAL CHANGE</text><text x="660" y="1192">Anti-government ideology; some adherents have</text><text x="660" y="1224">engaged in fraud or violence.</text>
<text x="90" y="1305" font-weight="700" fill="#0b315b">CITIZENS BRANCH</text><text x="90" y="1337">A civic concept — NOT a fourth branch.</text>
<text x="660" y="1305" font-weight="700" fill="#8e2430">CITIZENS BRANCH</text><text x="660" y="1337">No equivalent constitutional civic framework.</text>
</g>
<rect x="55" y="1380" width="1090" height="82" rx="14" fill="#0b315b"/>
<text x="600" y="1415" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">The Supreme Citizens Charter is not affiliated with the sovereign citizen movement.</text>
<text x="600" y="1445" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#f0d38a">Supreme Citizens participate in constitutional government; they do not claim exemption from it. • SupremeCitizens.org</text>
</svg>